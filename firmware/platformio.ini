; SunTracker firmware — see rodo/suntracker/project/architecture.md
; Layers: lib/core (pure logic), lib/hal (interfaces), lib/drivers (ESP32),
; lib/sim (fakes for host tests), lib/web (web panel, cycle 008).

[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
; lib/core is one library; its subfolders (sun/, ...) are added to the include path here.
build_flags = -std=gnu++17 -Wall -Wextra -Ilib/core/sun -Ilib/core/angle -Ilib/core/motion -Ilib/core/settings -Ilib/core/events -Ilib/core/time -Ilib/core/control -Ilib/core/wind
; Headers in lib/core subfolders are not found by the library dependency finder, so
; name the library explicitly (otherwise tests that only include sun/ headers do not link it).
lib_deps = core

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/version.py
lib_ignore = sim

; Bench image with a serial console for checking the real board (never ship this one).
[env:esp32dev-bench]
extends = env:esp32dev
build_flags = ${env.build_flags} -DBENCH_CONSOLE

; Host tests: pio test -d firmware -e native
[env:native]
platform = native
test_framework = unity
; UNITY_INCLUDE_DOUBLE: without it Unity's double asserts are not compiled and always fail.
build_flags = ${env.build_flags} -Werror -DUNITY_INCLUDE_DOUBLE
lib_ignore = drivers, web
